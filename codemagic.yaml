workflows:
  android-workflow:
    name: Ghaith APK Final
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.22.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean everything
        script: |
          flutter clean
          rm -rf pubspec.lock
          rm -rf .dart_tool
      - name: Create Android folder
        script: |
          flutter create . --platforms=android --project-name ghaith --org dev.sara
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
