workflows:
  android-workflow:
    name: Ghaith APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.24.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Create Android folder
        script: |
          flutter create . --platforms=android --project-name ghaith
          # Add desugaring fix
          echo "Adding desugaring..."
          sed -i '' 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle || sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - sara@example.com
